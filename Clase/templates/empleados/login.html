{% extends 'empleados/base.html' %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-5">
        
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Iniciar sesión</h4>
            </div>
            
            <div class="card-body">
                {% if form.errors %}
                    <div class="alert alert-danger">Usuario o contraseña incorrectos.</div>
                {% endif %}
                
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="{{ form.username.id_for_label }}" class="form-label">Usuario</label>
                        <input type="text" name="username" id="{{ form.username.id_for_label }}" class="form-control" autocomplete="username" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="{{ form.password.id_for_label }}" class="form-label">Contraseña</label>
                        <input type="password" name="password" id="{{ form.password.id_for_label }}" class="form-control" autocomplete="current-password" required>
                    </div>
                    
                    {% if next %}
                        <input type="hidden" name="next" value="{{ next }}">
                    {% endif %}
                    
                    <button type="submit" class="btn btn-primary w-100">Entrar</button>
                </form>
            </div>
        </div>
        
    </div>
</div>

{% endblock %}
