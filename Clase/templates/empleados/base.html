<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de empleados{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'lista_empleados' %}">Sistema de empleados</a>
            
            {% if user.is_authenticated %}
                <div class="d-flex align-items-center gap-3">
                    <span class="text-white">Usuario: {{ user.username }}</span>
                    <a href="{% url 'lista_empleados' %}" class="btn btn-outline-light btn-sm">Empleados</a>
                    
                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-warning btn-sm">
                            Cerrar sesión
                        </button>
                    </form>
                </div>
            {% endif %}
        </div>
    </nav>

    <main class="container py-4">
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
